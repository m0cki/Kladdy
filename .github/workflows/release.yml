# Manuelles Release (Ablauf in RELEASE.md). Läuft NUR per Hand über „Run workflow“ und nur von main.
# 1. Vorprüfung (Branch, Signatur-Secret, pubkey, Checks auf main grün)  2. Version erhöhen, Release-Commit + Tag
# pushen (nur den Tag, main ist geschützt)  3. Bauen, signieren und als GitHub-Release veröffentlichen
# (.dmg, .app.tar.gz, .sig, latest.json).
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Versionssprung (SemVer)'
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: 'Als Vorabversion (Beta) markieren – bekommt kein automatisches Update'
        type: boolean
        default: false
      notes:
        description: 'Was ist neu? (leer = automatisch aus den Änderungen seit dem letzten Tag)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  vorpruefung:
    name: Vorprüfung
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Nur von main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Releases werden nur von main erstellt (gestartet auf ${GITHUB_REF})."
          exit 1

      - name: Signatur-Secret vorhanden?
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Das Secret TAURI_SIGNING_PRIVATE_KEY fehlt (Settings → Secrets and variables → Actions). Siehe RELEASE.md."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 50

      - name: Öffentlicher Update-Schlüssel eingetragen?
        run: |
          if grep -q 'KLADDY_UPDATER_PUBKEY_PLATZHALTER' src-tauri/tauri.conf.json; then
            echo "::error::plugins.updater.pubkey in src-tauri/tauri.conf.json ist noch der Platzhalter. Erst den öffentlichen Schlüssel eintragen (RELEASE.md)."
            exit 1
          fi

      # Die Checks laufen bei jedem Push auf main (ci.yml). Statt sie hier zu wiederholen, wird ihr Ergebnis für
      # genau diesen Commit abgefragt. Ohne eigenen Lauf sind nur reine Doku-Änderungen erlaubt (paths-ignore in
      # ci.yml, Liste in DOKU_PFADE gleich halten); für sie zählt der Vorgänger (erster Elternteil).
      - name: Checks green on main?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DOKU_PFADE='(\.md$|^referenz/|^docs/|^LICENSE$)'
          SHA="${GITHUB_SHA}"
          while :; do
            RUN="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${SHA}&event=push&per_page=1" \
              --jq '.workflow_runs[0] | if . == null then "" else .status + "|" + (.conclusion // "") + "|" + .html_url end')"
            if [ -n "$RUN" ]; then
              IFS='|' read -r STATUS CONCLUSION URL <<< "$RUN"
              if [ "$STATUS" != "completed" ]; then
                echo "::error::Die CI für ${SHA:0:7} läuft noch (${URL}). Warten, bis sie grün ist, dann Release neu starten."
                exit 1
              fi
              if [ "$CONCLUSION" != "success" ]; then
                echo "::error::Die CI für ${SHA:0:7} ist nicht grün (${CONCLUSION}: ${URL}). Nichts veröffentlicht."
                exit 1
              fi
              echo "CI grün für ${SHA:0:7}: ${URL}"
              break
            fi
            # kein Lauf: nur erlaubt, wenn der Commit nur Doku ändert (Vergleich mit dem ersten Elternteil)
            DATEIEN="$(git diff --name-only "${SHA}^1" "$SHA")"
            NICHT_DOKU="$(printf '%s\n' "$DATEIEN" | grep -Ev "$DOKU_PFADE" | grep -v '^$' || true)"
            if [ -z "$NICHT_DOKU" ]; then
              echo "${SHA:0:7} ändert nur Doku – prüfe den Vorgänger."
              SHA="$(git rev-parse "${SHA}^1")"
              continue
            fi
            echo "::error::Für ${SHA:0:7} gibt es keinen CI-Lauf auf main. Nichts veröffentlicht."
            exit 1
          done

  release:
    name: Version, Tag & Veröffentlichen
    needs: vorpruefung
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      CARGO_TERM_COLOR: always
    steps:
      # Genau der Commit, den die CI geprüft hat (nicht ein inzwischen neuerer Stand von main)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Abhängigkeiten installieren
        run: npm ci

      # Die Release-Commits liegen nicht auf main (geschützt, die Action pusht nur den Tag). Die zuletzt
      # veröffentlichte Version steht deshalb im höchsten Tag, nicht in den Versionsdateien auf main.
      # Ausgangspunkt ist die höhere von beiden; so lässt sich per „set“ auf main auch ein Sprung vorgeben.
      - name: Version erhöhen
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm run --silent version:check
          DATEI="$(node scripts/version.mjs get)"
          LETZTER_TAG="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)"
          BASIS="$(printf '%s\n%s\n' "$DATEI" "${LETZTER_TAG#v}" | grep -v '^$' | sort -V | tail -n 1)"
          echo "Versionsdateien: ${DATEI}, letzter Tag: ${LETZTER_TAG:-keiner}, Basis: ${BASIS}"
          if [ "$BASIS" != "$DATEI" ]; then node scripts/version.mjs set "$BASIS" >/dev/null; fi
          VERSION="$(node scripts/version.mjs bump "$BUMP")"
          TAG="v${VERSION}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null || git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null; then
            echo "::error::Der Tag ${TAG} existiert schon. Nichts veröffentlicht (RELEASE.md → „Wenn etwas schiefgeht“)."
            exit 1
          fi
          npm run --silent version:check
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Neue Version: ${VERSION}"

      - name: Release-Notizen
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ -n "$(printf '%s' "$NOTES" | tr -d '[:space:]')" ]; then
            printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          else
            # höchster bisheriger Tag (git describe findet ihn nicht: Release-Commits liegen neben main)
            PREV="$(git tag -l 'v[0-9]*' --sort=-v:refname | head -n 1)"
            ARGS=(-f "tag_name=${TAG}" -f "target_commitish=${GITHUB_SHA}")
            [ -n "$PREV" ] && ARGS+=(-f "previous_tag_name=${PREV}")
            if ! gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" "${ARGS[@]}" --jq .body > "$RUNNER_TEMP/notes.md"; then
              # Rückfall: Commits seit dem letzten Tag
              RANGE="${PREV:+${PREV}..}HEAD"
              { echo "## Änderungen"; git log --no-merges --pretty='- %s' $RANGE; } > "$RUNNER_TEMP/notes.md"
            fi
          fi
          {
            echo "body<<KLADDY_NOTES_EOF"
            cat "$RUNNER_TEMP/notes.md"
            echo "KLADDY_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Release-Commit und Tag pushen
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Release-Commit unter dem Konto des Repository-Inhabers (nur m0cki erscheint als Contributor).
          # Er hängt direkt am geprüften main-Commit, wird aber nicht nach main gepusht (Ruleset: nur per PR);
          # der Tag hält ihn fest. main behält die alten Versionsdateien, maßgeblich ist der Tag.
          git config user.name "m0cki"
          git config user.email "148272869+m0cki@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git commit -m "Release ${TAG}"
          git tag -a "${TAG}" -m "Kladdy ${VERSION}"
          git push origin "refs/tags/${TAG}"

      - name: Bauen, signieren & veröffentlichen
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: Kladdy ${{ steps.version.outputs.version }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: ${{ inputs.prerelease }}
          uploadUpdaterJson: true
          args: --target aarch64-apple-darwin

      # Dieselbe .dmg zusätzlich als „Kladdy.dmg“: Der Name bleibt gleich, deshalb lädt
      # …/releases/latest/download/Kladdy.dmg immer die neueste Version (Link in der README).
      - name: Feste Download-Datei (Kladdy.dmg)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release download "$TAG" --pattern "Kladdy_${VERSION}_aarch64.dmg" --dir "$RUNNER_TEMP/dl"
          cp "$RUNNER_TEMP/dl/Kladdy_${VERSION}_aarch64.dmg" "$RUNNER_TEMP/dl/Kladdy.dmg"
          gh release upload "$TAG" "$RUNNER_TEMP/dl/Kladdy.dmg" --clobber
