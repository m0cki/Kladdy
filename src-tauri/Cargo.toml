[package]
name = "kladdy"
version = "0.1.0"
description = "Kladdy – Buchhaltung für das Kleingewerbe"
authors = ["Kladdy"]
edition = "2024"
license = "MIT"

[lib]
# Der Suffix `_lib` hält den Bibliotheksnamen eindeutig neben dem Binärnamen.
name = "kladdy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-updater = "2.13.3"
tauri-plugin-process = "2.4.0"
tauri-plugin-sql = { version = "2.5.0", features = ["sqlite"] }
# Dieselbe sqlx-Version wie tauri-plugin-sql; direkt nur für die Sicherung vor Migrationen (src/datenbank.rs).
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
