# Wöchentliche Prüfung der Abhängigkeiten auf bekannte Sicherheitslücken (npm und Cargo).
# Läuft nicht bei Pull Requests und blockiert nichts: ein roter Lauf ist ein Hinweis, dass ein Update ansteht.
# Von Hand startbar über „Run workflow“.
name: Abhängigkeiten prüfen

on:
  schedule:
    - cron: '30 6 * * 1' # montags 06:30 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Nur Lücken ab „high“ lassen den Lauf scheitern; alles Niedrigere steht im Protokoll.
      - name: npm audit
        run: npm audit --audit-level=high

  cargo:
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # Fertiges Binary statt cargo install (spart Minuten). Prüft nur Cargo.lock gegen die RustSec-Datenbank.
      - uses: taiki-e/install-action@cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
